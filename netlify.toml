# The portal lives in demo_app/web: Netlify builds it there and serves dist/.
# The Python backend (demo_app/server.py) is replaced by Netlify Functions in demo_app/web/netlify/functions.
#
# Site environment variables (Site configuration -> Environment variables):
#   GOODDATA_API_TOKEN  admin token (required: overview, Control Center, admin persona)
#   DEMO_PASSWORD       strongly recommended: the functions hand API tokens to the browser,
#                       so without a password anyone with the URL could use them
#   GOODDATA_TOKEN_ANALYZE / GOODDATA_TOKEN_VIEW   optional, override demo_app/.tokens.json

[build]
  base = "demo_app/web"
  # vite build only: the type check runs locally; the GoodData SDK makes tsc + bundling too big for the default heap
  command = "npm ci && npx vite build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NODE_OPTIONS = "--max-old-space-size=4096"

# single-page app: every other path is the React app (functions match first)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
