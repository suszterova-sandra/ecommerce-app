# A metric is a computational expression of numerical data (facts or other metrics).
# Use MAQL to create reusable multidimensional queries that combine multiple facts and attributes.
# Read more about MAQL:
# https://www.gooddata.com/developers/cloud-native/doc/cloud/create-metrics/maql/

type: metric
id: sales_converted_currency

title: Sales (Converted Currency)

maql: |-
  SELECT CASE
    WHEN {parameter/currency-rate} = "USD" THEN SUM({metric/total_sales})
    WHEN {parameter/currency-rate} = "EUR" THEN SUM({metric/total_sales}) * 0.92
    WHEN {parameter/currency-rate} = "CZK" THEN SUM({metric/total_sales}) * 23.5
    ELSE NULL
  END
format: "#,##0.00"
