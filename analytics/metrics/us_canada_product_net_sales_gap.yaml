# A metric is a computational expression of numerical data (facts or other metrics).
# Use MAQL to create reusable multidimensional queries that combine multiple facts and attributes.
# Read more about MAQL:
# https://www.gooddata.com/developers/cloud-native/doc/cloud/create-metrics/maql/

type: metric
id: us_canada_product_net_sales_gap

title: United States–Canada Product Net Sales Gap
description: Difference in Total Net Sales between the United States and Canada for each product, respecting the selected time range and product breakdown.
tags:
  - comparison
  - product
  - revenue

maql: SELECT (SELECT {metric/net_sales} WHERE {label/customer_country} = "United States") - (SELECT {metric/net_sales} WHERE {label/customer_country} = "Canada")
format: $#,##0.00
