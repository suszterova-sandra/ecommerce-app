# A metric is a computational expression of numerical data (facts or other metrics).
# Use MAQL to create reusable multidimensional queries that combine multiple facts and attributes.
# Read more about MAQL:
# https://www.gooddata.com/developers/cloud-native/doc/cloud/create-metrics/maql/

type: metric
id: of_orders_2

title: "# of Orders (intervals)"
description: Measures total orders placed, providing insight into sales volume and customer engagement over time.

maql: |-
  SELECT
    CASE
      WHEN {metric/number_of_orders} < 100 THEN "low"
      WHEN {metric/number_of_orders} < 200 THEN "high"
      WHEN {metric/number_of_orders} >= 300 THEN "high"
    END
  by {label/product_id}
format: "#,##0"
