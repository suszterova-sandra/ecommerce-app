# A metric is a computational expression of numerical data (facts or other metrics).
# Use MAQL to create reusable multidimensional queries that combine multiple facts and attributes.
# Read more about MAQL:
# https://www.gooddata.com/developers/cloud-native/doc/cloud/create-metrics/maql/

type: metric
id: order_cancellation_rate

title: Order Cancellation Rate
description: Share of orders marked as canceled out of all orders.
tags:
  - KPI
  - cancellation
  - orders
  - rate

maql: SELECT IFNULL((SELECT {metric/number_of_orders} WHERE {label/order_status} = "Canceled") / {metric/number_of_orders}, 0)
format: 0.0%
