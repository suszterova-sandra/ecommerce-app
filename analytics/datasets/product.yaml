type: dataset
id: product

table_path: ECOMMERCE_DEMO_SCHEMA/product

title: Product
description: Product
tags:
  - Product

primary_key: product_id

fields:
  product_brand:
    type: attribute
    source_column: product_brand
    data_type: STRING
    title: Product brand
    description: Product brand
    tags:
      - Product
    is_nullable: true
    null_value_join_replacement: _
  product_category:
    type: attribute
    source_column: product_category
    data_type: STRING
    title: Product category
    description: Product category
    tags:
      - Product
    is_nullable: true
    null_value_join_replacement: _
  product_id:
    type: attribute
    source_column: product_id
    data_type: STRING
    title: Product id
    description: Product id
    tags:
      - Product
    is_nullable: false
    null_value_join_replacement: _
    labels:
      product_id_image_web:
        source_column: ls__product_id__product_id_image_web
        data_type: STRING
        title: Product id image web
        description: Product id image web
        tags:
          - Product
        value_type: IMAGE
        is_nullable: true
        null_value_join_replacement: _
      product_name:
        source_column: ls__product_id__product_name
        data_type: STRING
        title: Product name
        description: Product name
        tags:
          - Product
        is_nullable: true
        null_value_join_replacement: _
  product_image:
    type: attribute
    source_column: product_image
    data_type: STRING
