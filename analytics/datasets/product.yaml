    description: Product image
    tags:
      - Product
    is_nullable: true
    null_value_join_replacement: _
    labels:
      product_image_web:
        source_column: ls__product_image__product_image_web
        data_type: STRING
        title: Product image web
        description: Product image web
        tags:
          - Product
        is_nullable: true
        null_value_join_replacement: _
  product_rating:
    type: attribute
    source_column: product_rating
    data_type: STRING
    title: Product rating
    description: Rating category or label for the product (dimension for filtering and grouping).
    tags:
      - Product
    is_nullable: true
    null_value_join_replacement: _
  rating:
    type: fact
    source_column: rating
    data_type: NUMERIC
    title: Rating
    description: Rating
    tags:
      - Product
    is_nullable: true
    null_value_join_replacement: "0"

workspace_data_filters:
