# https://www.gooddata.com/developers/cloud-native/doc/cloud/create-visualizations/concepts/visualization/

type: line_chart
id: 1966fb7a-01d5-49bb-ab14-615f6be6b7a2

title: Net Orders by Week (Last 12 Months) - test

query:
  fields:
    local_metric_0: metric/net_orders
    local_dimension_0: label/order_date.week

  filter_by:
    order_date_month:
      type: date_filter
      granularity: MONTH
      from: -11
      to: 0
      using: order_date

metrics:
  - local_metric_0

view_by:
  - local_dimension_0
